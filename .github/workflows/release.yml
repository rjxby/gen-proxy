name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build-asset:
    name: Build macOS Binary
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Backend/GenProxy.sln

      - name: Build
        run: dotnet build Backend/GenProxy.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test Backend/Tests/GenProxy.Api.UnitTests/GenProxy.Api.UnitTests.csproj -c Release --no-build

      - name: Run integration tests
        run: dotnet test Backend/Tests/GenProxy.Api.IntegrationTests/GenProxy.Api.IntegrationTests.csproj -c Release --no-build

      - name: Publish release binary
        run: |
          dotnet publish Backend/Api/Host/GenProxy.Api.Host.csproj \
            -c Release \
            -r osx-arm64 \
            --self-contained true \
            /p:PublishSingleFile=true \
            /p:PublishReadyToRun=true \
            /p:EnableCompressionInSingleFile=true \
            /p:DebugType=None \
            /p:DebugSymbols=false \
            -o dist/publish
          test -f dist/publish/GenProxy.Api.Host
          cp dist/publish/GenProxy.Api.Host dist/gen-proxy-osx-arm64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gen-proxy-osx-arm64
          path: dist/gen-proxy-osx-arm64

  create-release:
    name: Create Release
    needs: build-asset
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/gen-proxy-osx-arm64
          generate_release_notes: true
          draft: false
          prerelease: false
